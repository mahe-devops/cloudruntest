steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/simple-app:$COMMIT_SHA
      - -f
      - simple-app/Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/simple-app:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - us-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/simple-app:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
images:
  - us-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/simple-app:$COMMIT_SHA

substitutions:
  _REGION: us-central1
  _SERVICE: simple-app
